name: Build Fix and Go Board APK

on:
  push:
    branches: [main]
    paths:
      - 'testing-fix-and-go-app/**'
      - '.github/workflows/build-fixgo-board.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: testing-fix-and-go-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish as the "fixgo-board-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp testing-fix-and-go-app/app/build/outputs/apk/debug/app-debug.apk FixGoBoard.apk
          gh release delete fixgo-board-latest --cleanup-tag --yes || true
          gh release create fixgo-board-latest FixGoBoard.apk --title "Fix and Go Board - Latest build" --notes "Build of ${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: FixGoBoard-apk
          path: FixGoBoard.apk
