name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HG8347R.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest HG8347R.apk --title "Latest build" --notes "Build of ${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: HG8347R-apk
          path: HG8347R.apk
