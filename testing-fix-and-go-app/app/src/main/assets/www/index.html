<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fix and Go Board</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">FIX AND GO<span> BOARD</span></div>
  <div class="login-box">
    <input id="login-email" type="email" placeholder="Email" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <div id="top-header">
    <button class="menu-btn" id="menu-btn" onclick="openSidebar()" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="title">FIX AND GO<span> BOARD</span></div>
  </div>
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="Search ref, address, tenant, tech...">
    <button id="filter-btn" class="filter-btn" onclick="openFilterSheet()" aria-label="Filter" style="display:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>
      <span class="filter-dot" id="filter-dot"></span>
    </button>
  </div>
  <div id="tab-bar"></div>
  <div class="pull-indicator" id="pull-indicator">Refreshing...</div>
  <div id="pager"></div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sb-profile">
    <div class="sb-avatar" id="sb-avatar"></div>
    <div class="sb-name" id="sb-name"></div>
    <div class="sb-role" id="sb-role"></div>
  </div>
  <nav class="sb-nav">
    <button class="sb-item sb-primary" id="sb-newjob" onclick="sbAction('newjob')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>New Job</span>
    </button>
    <button class="sb-item" onclick="sbAction('refresh')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span>Update</span>
    </button>
    <div class="sb-label" id="sb-people-label">People</div>
    <button class="sb-item" id="sb-team" onclick="sbAction('team')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.8c2 .6 3.5 2.4 3.5 5.2"/></svg><span>Team</span>
    </button>
    <button class="sb-item" id="sb-tech" onclick="sbAction('tech')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span>Technicians</span>
    </button>
  </nav>
  <div class="sb-bottom">
    <button class="sb-item sb-signout" onclick="doLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg><span>Sign Out</span>
    </button>
  </div>
</aside>

<div id="team-sheet">
  <div class="sheet-header">
    <div class="sheet-title" id="sheet-title">Team</div>
    <button class="sheet-close" onclick="closeTeamSheet()">&times;</button>
  </div>
  <div id="team-list"></div>
</div>
<div class="sheet-backdrop" id="team-backdrop" onclick="closeTeamSheet()"></div>

<div id="newjob-screen">
  <div class="detail-header-bar">
    <button class="detail-back-btn" onclick="closeNewJobScreen()">&larr;</button>
    <div class="ht"><div class="title" style="font-size:1.05rem;">New Job</div></div>
    <button class="save-btn" onclick="submitNewJob()">Create</button>
  </div>
  <div id="newjob-body">
    <div class="info-field"><label>Title *</label><input class="field-input" id="nj-title" placeholder="e.g. Kitchen Ceiling Leak"></div>
    <div class="info-field"><label>Address *</label><input class="field-input" id="nj-address" placeholder="Full address"></div>
    <div class="info-field"><label>Ticket ID</label><input class="field-input" id="nj-ticket-id" placeholder="External ticket ID (optional)"></div>
    <div class="info-field"><label>Tenant</label><input class="field-input" id="nj-tenant" placeholder="Tenant name"></div>
    <div class="info-field"><label>Tenant Phone</label><input class="field-input" id="nj-tenant-phone" placeholder="Tenant phone"></div>
    <div class="info-field"><label>Description</label><textarea class="field-input" id="nj-description" rows="4" placeholder="Scope / issue details"></textarea></div>
    <div class="info-field"><label>Status</label>
      <select class="field-input" id="nj-status">
        <option value="active">Active</option>
        <option value="contacted">Contacted</option>
        <option value="booked">Booked</option>
        <option value="revisit">Revisit</option>
      </select>
    </div>
    <div class="info-field"><label>Category</label><input class="field-input" id="nj-category" placeholder="e.g. Plumbing"></div>
    <div class="info-field checkbox-field"><label><input type="checkbox" id="nj-quote-needed"> This is a quote request, not a job yet</label></div>
  </div>
</div>
<div class="sheet-backdrop" id="newjob-backdrop"></div>

<div id="detail-screen">
  <div id="detail-header">
    <button id="detail-back" onclick="closeDetail()">&larr;</button>
    <div class="ht">
      <div class="ref" id="d-ref"></div>
      <div class="title" id="d-title"></div>
    </div>
    <button class="hdr-icon-btn" id="d-edit-btn" onclick="enterEditMode()" title="Edit">&#9998;</button>
    <button class="save-btn" id="d-save-btn" style="display:none;" onclick="saveJobEdits()">Save</button>
    <button class="hdr-icon-btn" id="d-cancel-btn" style="display:none;" onclick="cancelEditMode()" title="Cancel">&times;</button>
  </div>
  <div id="detail-tabs">
    <button class="detail-tab-btn active" data-tab="info" onclick="switchDetailTab('info')">Info</button>
    <button class="detail-tab-btn" data-tab="comments" onclick="switchDetailTab('comments')">Comments</button>
  </div>
  <div id="detail-body">
    <div class="detail-panel active" id="panel-info"></div>
    <div class="detail-panel" id="panel-comments">
      <div id="comment-list"></div>
    </div>
  </div>
  <div class="photo-preview" id="photo-preview" style="display:none;"></div>
  <div id="comment-compose" style="display:none;">
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;" onchange="onPhotoChosen(event)">
    <button class="icon-btn" onclick="document.getElementById('camera-input').click()">📷</button>
    <textarea id="comment-input" placeholder="Write a comment..." rows="1"></textarea>
    <button class="icon-btn send" onclick="postComment()">&#10148;</button>
  </div>
</div>

<datalist id="tech-names-list"></datalist>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
