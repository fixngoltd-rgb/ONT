plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fixngo.hg8347r'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fixngo.hg8347r'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    // Fixed key committed to the (private) repo so every build installs over the last one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
